<p id="out"></p>
<div style="height:420px"><canvas id="chart"></canvas></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
const doseMg = 35;
const weightKg = 70;
const vcL = 0.07 * weightKg;
const clLPerMin = 0.32 * weightKg / 60;

const tHalfAlpha = 2;
const tHalfBeta = 21;
const alpha = Math.log(2) / tHalfAlpha;
const beta = Math.log(2) / tHalfBeta;

const c0 = doseMg / vcL;
const k10 = clLPerMin / vcL;
const k21 = alpha * beta / k10;
const A = c0 * (alpha - k21) / (alpha - beta);
const B = c0 - A;

const tHalfKe0 = 5.9;
const ke0 = Math.log(2) / tHalfKe0;
const ec90 = 1.13;
const dt = 0.01;

const cpPoints = [];
const cePoints = [];
let ce = 0;
let onset = null;
let offset = null;
let cpLast = null;

for (let i = 0; i <= 60 / dt; i++) {
  const t = i * dt;
  const cp = A * Math.exp(-alpha * t) + B * Math.exp(-beta * t);

  if (i % 10 === 0) {
    cpPoints.push({ x: t, y: cp });
    cePoints.push({ x: t, y: ce });
  }

  if (onset === null && ce >= ec90) { onset = t; }
  if (ce >= ec90) { offset = t; }
  if (cp >= ec90) { cpLast = t; }

  ce = ce + ke0 * (cp - ce) * dt;
}

const fmt = (v) => v === null ? "never" : v.toFixed(1) + " min";
document.getElementById("out").textContent =
  `Onset (Ce reaches EC90): ${fmt(onset)} | Offset (Ce below EC90): ${fmt(offset)} | Cp below EC90: ${fmt(cpLast)}`;

const mark = (label, t, color) => ({
  type: "scatter",
  label: label + (t === null ? "" : " " + t.toFixed(1) + " min"),
  data: t === null ? [] : [{ x: t, y: ec90 }],
  pointRadius: 8,
  backgroundColor: color
});

new Chart(document.getElementById("chart"), {
  type: "line",
  data: { datasets: [
    { label: "Cp", data: cpPoints, pointRadius: 0 },
    { label: "Ce", data: cePoints, pointRadius: 0, borderDash: [6, 4] },
    { label: "EC90", data: [{ x: 0, y: ec90 }, { x: 60, y: ec90 }], pointRadius: 0, borderColor: "gray" },
    mark("Onset", onset, "green"),
    mark("Offset", offset, "red")
  ] },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: "nearest", axis: "x", intersect: false },
    scales: {
      x: { type: "linear", min: 0, max: 60, ticks: { stepSize: 5 }, title: { display: true, text: "Time (min)" } },
      y: { min: 0, title: { display: true, text: "mg/L" } }
    }
  }
});
</script>
