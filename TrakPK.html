<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PkCurves</title>

    <style>
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .card { background: #242424; border-radius: 8px; padding: 10px 12px; }
    .label { font-size: 12px; color: #a0a0a0; }
    .value { font-size: 20px; font-weight: 500; }
    .sub { font-size: 12px; color: #a0a0a0; }
</style>

</head>
<body style="background-color: #191919; color: #e6e6e6;">

<div class="cards">
    <div class="card"><div class="label">Onset (Ce reaches EC90)</div><div class="value" id="onset"></div></div>
    <div class="card"><div class="label">Offset (Ce below EC90)</div><div class="value" id="offset"></div></div>
    <div class="card"><div class="label">Cp below EC90</div><div class="value" id="cpLast"></div></div>
    <div class="card"><div class="label">Peak Ce</div><div class="value" id="peak"></div><div class="sub" id="peakTime"></div></div>
</div>

<div style="height:420px"><canvas id="chart"></canvas></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>

<script>
    const doseMgTrac = 35;
    const weightKg = 70; // Виж дали можеш да направиш модел с промяна в килограмите и доза според килограмите
    const vcLTrac = 0.07 * weightKg;
    const clLPerMinTrac = 0.32 * weightKg / 60;

    const tHalfAlphaTrac = 2;
    const tHalfBetaTrac = 21;
    const alphaTrac = Math.log(2) / tHalfAlphaTrac;
    const betaTrac = Math.log(2) / tHalfBetaTrac;

    const c0Trac = doseMgTrac / vcLTrac;

    const k10 = clLPerMinTrac / vcLTrac;
    const k21 = alphaTrac * betaTrac / k10;
    const ATrac = c0Trac * (alphaTrac - k21) / (alphaTrac - betaTrac);
    const BTrac = c0Trac - ATrac;

    const tHalfKe0Trac = 5.9;
    const ke0Trac = Math.log(2) / tHalfKe0Trac;
    const ec90Trac = 1.13;
    const dt = 0.1; // Погледни си в данните за графиката ако ще променяш интервала, който ще наблюдаваш
    const cpPoints = [];
    const cePoints = [];
    let ce = 0;
    let peakCe = 0;
    let peakTime = 0;

    let onset = null;
    let offset = null;
    let cpLast = null;

    for (let i = 0; i <= 60 / dt; i++) {
        const t = i * dt;
        const cp = ATrac * Math.exp(-alphaTrac * t) + BTrac * Math.exp(-betaTrac * t);

        cpPoints.push({ x: t, y: cp });
        cePoints.push({ x: t, y: ce });

        if (ce > peakCe) {
            peakCe = ce;
            peakTime = t;
        }

        if (onset === null && ce >= ec90Trac) { onset = t; }
        if (ce >= ec90Trac) { offset = t; }
        if (cp >= ec90Trac) { cpLast = t; }

        ce = ce + ke0Trac * (cp - ce) * dt;
    }

    const fmt = (v) => v === null ? "never" : v.toFixed(1) + " min";
    document.getElementById("onset").textContent = fmt(onset);
    document.getElementById("offset").textContent = fmt(offset);
    document.getElementById("cpLast").textContent = fmt(cpLast);
    document.getElementById("peak").textContent = peakCe.toFixed(2) + " mg/L";
    document.getElementById("peakTime").textContent = "at " + peakTime.toFixed(1) + " min";

    const mark = (label, t, color) => ({
        type: "scatter",
        label: label + (t === null ? "" : " " + t.toFixed(1) + " min"),
        data: t === null ? [] : [{ x: t, y: ec90Trac }],
        pointRadius: 8,
        backgroundColor: color
    });


    Chart.defaults.color = "#e6e6e6";
    Chart.defaults.borderColor = "rgba(255,255,255,0.15)";
    new Chart(document.getElementById("chart"), {
        type: "line",
        data: { datasets: [
            { label: "Cp", data: cpPoints, pointRadius: 0, borderColor: "#4da3ff", borderWidth: 2 },
{ label: "Ce", data: cePoints, pointRadius: 0, borderColor: "#ff6b6b", borderWidth: 2, borderDash: [6, 4] },
{ label: "EC90", data: [{ x: 0, y: ec90Trac }, { x: 60, y: ec90Trac }], pointRadius: 0, borderColor: "#f5c518", borderWidth: 1.5 },
            mark("Onset", onset, "green"),
            mark("Offset", offset, "red")
        ] },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                title: {display: true, text: `Atracurium ${doseMgTrac} mg induction bolus (${weightKg} kg)` , font: { size: 18 }}
            },
            interaction: { mode: "nearest", axis: "x", intersect: false },
            scales: {
                x: { type: "linear", min: 0, max: 60, ticks: { stepSize: 5 }, title: { display: true, text: "Time (min)" } },
                y: { min: 0, title: { display: true, text: "mg/L" } }
            }
        }
    });

    console.log(ATrac / c0Trac, BTrac / c0Trac);
    console.log(k10)
    console.log((0.3468*0.033)/0.076)
    
</script>

</body>
</html>
